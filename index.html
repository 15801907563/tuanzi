<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6b26b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="团子的喵生选择">
  <meta name="format-detection" content="telephone=no">
  <title>团子的喵生选择</title>

  <!-- 微信 / 社交分享卡片。微信会优先抓取 title 和 og 信息 -->
  <meta name="description" content="我是一只叫团子的猫。奶奶住院了，我要在宠物店里，自己挑一个主人。9个结局，你能全部找到吗？">
  <meta property="og:type" content="website">
  <meta property="og:title" content="团子的喵生选择">
  <meta property="og:description" content="我是一只叫团子的猫。奶奶住院了，我要在宠物店里，自己挑一个主人。9个结局，你能全部找到吗？">
  <meta property="og:image" content="share.png">
  <meta itemprop="name" content="团子的喵生选择">
  <meta itemprop="image" content="share.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- 标题页 -->
    <section id="screen-title" class="screen active" aria-label="标题">
      <div class="title-deco" aria-hidden="true">
        <span>🐟</span><span>🧶</span><span>🐾</span><span>☀️</span><span>🐾</span>
      </div>
      <div class="title-cat" aria-hidden="true">🐱</div>
      <h1 class="title-text">团子的喵生选择</h1>
      <p class="title-sub">一只懒猫的内心吐槽录</p>
      <div class="menu-btns">
        <button type="button" class="btn primary" id="btn-new">开始新故事</button>
        <button type="button" class="btn" id="btn-continue" hidden>继续故事</button>
        <button type="button" class="btn" id="btn-gallery">结局图鉴 <span id="gallery-count"></span></button>
      </div>
      <p class="title-tip">点击屏幕推进剧情 · 建议竖屏游玩</p>
    </section>

    <!-- 选择性别 -->
    <section id="screen-gender" class="screen" aria-label="选择性别">
      <h2 class="gender-title">团子是一只……</h2>
      <div class="gender-cards">
        <button type="button" class="gender-card male" data-gender="m">
          <span class="g-emoji" aria-hidden="true">🐱</span>
          <span class="g-label">小公猫 ♂</span>
        </button>
        <button type="button" class="gender-card female" data-gender="f">
          <span class="g-emoji" aria-hidden="true">🐱</span>
          <span class="g-label">小母猫 ♀</span>
        </button>
      </div>
      <div class="profile">
        <p><b>姓名：</b>团子</p>
        <p><b>年龄：</b>3岁（橘猫）</p>
        <p><b>性格：</b>慵懒，但内心戏超多</p>
      </div>
      <p class="hint">性别会影响故事里的一些细节</p>
      <button type="button" class="btn small ghost" id="btn-gender-back">返回</button>
    </section>

    <!-- 游戏主界面 -->
    <section id="screen-game" class="screen" aria-label="游戏">
      <div id="stage" class="stage">
        <div id="bg" class="bg"></div>
        <div id="decor" class="decor" aria-hidden="true"></div>
        <div id="chars" class="chars"></div>
        <button type="button" id="btn-menu" class="icon-btn" aria-label="菜单">☰</button>
        <div id="toast-area" class="toast-area" aria-live="polite"></div>
      </div>
      <div id="dialog" class="dialog narr" tabindex="0" aria-live="polite">
        <div id="speaker" class="speaker" hidden></div>
        <div id="text" class="text"></div>
        <div id="next-indicator" class="next-indicator" aria-hidden="true">▼</div>
      </div>
      <div id="choices" class="choices" hidden></div>

      <!-- 人物档案卡 -->
      <div id="card" class="overlay" hidden>
        <div class="card-box" role="dialog" aria-label="人物档案">
          <div class="card-label">📋 领养人档案</div>
          <div id="card-emoji" class="card-emoji" aria-hidden="true"></div>
          <div id="card-name" class="card-name"></div>
          <div id="card-tag" class="card-tag"></div>
          <p id="card-desc" class="card-desc"></p>
          <div class="card-tip">点击任意处继续</div>
        </div>
      </div>

      <!-- 菜单 -->
      <div id="menu" class="overlay" hidden>
        <div class="menu-box" role="dialog" aria-label="菜单">
          <h3>暂停一下</h3>
          <button type="button" class="btn primary" id="menu-resume">继续游戏</button>
          <button type="button" class="btn" id="menu-speed">文字速度：中</button>
          <button type="button" class="btn" id="menu-title">回到标题（已自动存档）</button>
        </div>
      </div>
    </section>

    <!-- 结局页 -->
    <section id="screen-ending" class="screen" aria-label="结局">
      <div class="ending-box">
        <div class="ending-label">— 结局达成 —</div>
        <div id="ending-new" class="ending-new" hidden>NEW</div>
        <h2 id="ending-title" class="ending-title"></h2>
        <div id="ending-route" class="ending-route"></div>
        <p id="ending-desc" class="ending-desc"></p>
        <p id="ending-ps" class="ending-ps"></p>
        <div id="ending-count" class="ending-count"></div>
        <div class="menu-btns">
          <button type="button" class="btn primary" id="ending-again">再来一次</button>
          <button type="button" class="btn" id="ending-gallery">结局图鉴</button>
        </div>
      </div>
    </section>

    <!-- 结局图鉴 -->
    <section id="screen-gallery" class="screen" aria-label="结局图鉴">
      <h2 class="gallery-title">结局图鉴</h2>
      <div id="gallery-progress" class="gallery-progress"></div>
      <ul id="gallery-list" class="gallery-list"></ul>
      <button type="button" class="btn ghost" id="gallery-back">返回</button>
    </section>

  </div>

  <script src="js/story.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
